function previewPolicy(shell,command){const blocked=/(^|[\s;|&])(rm\s+-|rmdir\b|del\s+[/\\-]|remove-item\b|format\b|sudo\b|shutdown\b|reboot\b|invoke-expression\b|iex\b)/i.test(command);if(blocked)return {allowed:false,rule:'block/high-risk'};const allow=shell==='bash'?/^\s*(date|pwd|whoami|uname|id|hostname|printf|echo|ls|cat|head|tail|grep|ps|df|du|env|printenv|which|type|stat|ip|ifconfig|netstat|ss|nslookup|dig|ping|sleep|true|false)\b/i:/^\s*(get-|test-|resolve-|measure-|select-|where-|sort-|format-|out-string|write-|start-sleep|compare-object|convertto-json|\[console\]::|exit\b)/i;const ok=command.split(/[\r\n;]+/).filter(x=>x.trim()).every(x=>allow.test(x));return {allowed:ok,rule:ok?'allow/diagnostics':'default/not-allowlisted'};}
function active(){return S?.operations?.find(x=>!terminalStatus.includes(x.status));}
function pageState(){if(PREVIEW&&previewStage)return previewStage;if(!S)return 'request';if(S.revoked||['revoked','expired'].includes(S.status))return 'complete';if(S.device?.host)return 'live';return 'request';}
function sampleOp(shell='powershell',status='completed'){return {id:'OP-DEMO-01',shell,command:shell==='bash'?'date\npwd':'Get-Date\nGet-Location',cwd:'',timeout:30,hash:'preview-hash',policy:'allow/diagnostics',created:new Date().toISOString(),status,outputs:status==='completed'?[{stream:'system',text:'[模拟输出 · 未在任何机器上执行]\n'},{stream:'stdout',text:shell==='bash'?'Mon Sep 28 09:41:12 UTC 2026\n/home/demo\n':'2026年9月28日 09:41:12\n\nPath\n----\nC:\\Users\\Demo\n'}]:[],exit_code:status==='completed'?0:null,duration_ms:240};}
function connectPreview(){S.accepted=true;S.paired=true;S.online=true;S.status='connected';S.device={type:'hello',host:'DESKTOP-DEMO',os:'windows/amd64',version:VERSION,pid:8240,shells:[selectedShell],cwd:'C:\\Users\\Demo',protocol_registered:true};addEvent('connected','模拟设备已就绪；此预览不运行本地命令。');modalKind='';previewStage='live';render();}
function fixture(stage){clearSimulation();S=previewSession();if(stage==='live'||stage==='complete'){connectPreview();S.operations=[sampleOp(selectedShell)];S.runs=1;addEvent('result','示例命令已完成，exit=0。')}if(stage==='complete'){S.revoked=true;S.online=false;S.stopped=true;S.status='revoked';addEvent('stopped','模拟执行器已确认停止。')}previewStage=stage;modalKind='';consent=false;render();}

function Header(){return `<header class="top"><div class="brand"><span class="brandmark">${ic('link')}</span><span class="brandname">assist</span><i class="brandline"></i><small>远程协助</small></div><div class="topmeta">${ENABLE_DEVTOOLS?`<span class="mode">${PREVIEW?'交互预览 · 模拟数据':'可运行验证 · v'+VERSION}</span>`:''}<div class="role"><span class="avatar">${role==='support'?'支':'客'}</span><span>${role==='support'?'支持方视角':'客户视角'}</span></div></div></header>`;}
function Stepper(stage){const phases=['request','live','complete'];const labels=['查看并连接','实时协助','完成回执'];let i=phases.indexOf(stage);return `<nav class="stepper" aria-label="协助进度">${labels.map((l,j)=>`${j?'<span class="step-line"></span>':''}<div class="step ${j===i?'active':j<i?'done':''}" ${j===i?'aria-current="step"':''}><i>${j<i?'✓':`0${j+1}`}</i>${l}</div>`).join('')}</nav>`;}
function PolicyCard(){const op=active();return `<section class="policy-card"><div class="policy-head">${ic('shield')}<div class="grow"><h2>命令策略已启用</h2><p>无逐条审批 · 服务端与执行器双重校验 · 黑名单优先</p></div>${pill(op?(statusText[op.status]||op.status):'实时保护',op?.status==='cancelling'?'amber':'green')}</div><div class="policy-grid"><div class="policy-rule allow"><h3>✓ 白名单自动执行</h3><p>系统信息、网络诊断、进程与日志读取等只读诊断命令。</p></div><div class="policy-rule block"><h3>⊘ 黑名单直接阻断</h3><p>删除文件、提权、账户与服务变更、关机及下载执行等高风险操作。</p></div></div><div class="policy-foot">未明确命中白名单的命令默认阻断；判定规则会随命令记录留痕。</div></section>`;}
function Footer(){return `<footer class="footer"><span>命令由策略自动判定。可随时结束，不会自动提权。</span><button data-action="trust">发布与安全信息</button></footer>`;}
function Scopes(){const items=[['network','建立一次临时连接','限时会话','仅回传设备名、系统版本和可用 Shell；结束后凭据立即失效。'],['terminal','自动校验 PowerShell / Bash 命令','策略准入','诊断白名单自动执行；高风险命令与未收录命令直接阻断，无需客户逐条确认。'],['file','共同查看命令输出与执行记录','全程留痕','标准输出、错误输出、策略判定和退出码同步到双方页面。']];return `<section class="card pad"><div class="cardhead"><h2>这次协助会做什么</h2>${pill('策略自动管控','green')}</div>${items.map(([i,t,tag,d])=>`<div class="scope"><div class="iconbox">${ic(i)}</div><div class="grow"><div class="row between"><h3>${t}</h3><span class="pill">${tag}</span></div><p>${d}</p></div></div>`).join('')}</section>`;}
function ConnectionSteps(){return `<div class="connectsteps"><div class="connectstep done"><i>✓</i>临时协助请求已就绪</div><div class="connectstep ${S.paired?'done':'current'}"><i>${S.paired?'✓':'2'}</i>${S.paired?'工具已完成配对':IS_MAC?'下载并打开 Mac App':'打开 assist · 首次使用下载后打开'}</div><div class="connectstep ${S.online?'done':''}"><i>${S.online?'✓':'3'}</i>${S.online?'设备已连接，策略已生效':'等待设备安全回连'}</div></div>`;}
function RequestSide(){if(role==='support'){return `<section class="card pad side"><h2>${S?'邀请客户加入':'发起一次协助'}</h2><p class="side-intro">${S?'设备上线后，Agent 即可在策略范围内连续诊断。':'为本次问题创建一个独立的限时请求。'}</p>${S?`<div class="duration"><div><small>邀请有效时间</small><br><strong data-clock>10:00</strong></div>${ic('clock')}</div><div class="linkfield">${esc(S.invite_url)}</div><p class="min-note">我的 IP：${esc(S.local_ip||'未检测到')}。请确认邀请链接中的该地址可从客户设备访问。</p><div class="stack mt" style="gap:9px">${btn('复制邀请链接','copy-invite','primary full','copy')}${btn('打开客户请求页','open-customer','full','external')}</div><p class="min-note">命令无需客户逐条审批；服务端和执行器会执行相同的黑/白名单策略。</p>`:`<label class="label" for="purpose">需要协助的问题</label><textarea id="purpose" maxlength="600">${esc(customPurpose)}</textarea><label class="label mt" for="localIP">我的 IP</label><select id="localIP" class="form" ${localIPs.length?'':'disabled'}>${localIPs.length?localIPs.map(a=>`<option value="${esc(a.ip)}" ${a.ip===localIP?'selected':''}>${esc(a.ip)} · ${esc(a.interface)}${a.loopback?'（仅本机）':''}</option>`).join(''):'<option>正在读取本机 IP…</option>'}</select><p class="min-note" id="networkResult">${esc(networkNote||'请选择客户所在网络能够访问的地址。')}</p>${btn('创建请求并生成链接','create','primary full mt','link',localIP?'':'disabled')}<p class="min-note">此按钮暂时代替本地 Agent 的 MCP 创建请求。</p>`}</section>`;}
 if(S?.accepted){return `<section class="card pad side"><div class="row between"><h2>准备连接这台设备</h2>${pill('等待回连','purple')}</div>${ConnectionSteps()}${IS_MAC?btn('下载 Mac App','connect-modal','primary full','download'):btn('打开 assist 协助工具','open-tool','primary full','external')+btn('首次使用？下载并打开一次','connect-modal','full mt','download')}<p class="min-note">${IS_MAC?'下载后解压并打开 Assist.app；App 会用终端显示连接状态，关闭终端可停止。':'没有收到回连不代表未安装。网页不会静默安装程序。'}</p>${btn('取消这次协助','end-dialog','ghost full')}</section>`;}
 return `<section class="card pad side"><h2>打开工具，开始协助</h2><p class="side-intro">不需要逐条审批。首次使用只需下载并打开一次，命令由预设策略自动判定。</p><div class="duration"><div><small>本次连接有效期</small><br><strong>10 <span class="small muted">分钟</span></strong></div>${ic('clock')}</div>${IS_MAC?btn('下载 Mac App','connect-modal','primary full','download'):btn('打开 assist 协助工具','open-tool','primary full','external')+btn('首次使用？下载并打开一次','connect-modal','full mt','download')}<div class="trust"><span class="row">${ic('info')}<span>策略保护 · 全程留痕</span></span><button class="btn ghost" data-action="trust">了解详情</button></div></section>`;}
function RequestPage(){return `<div class="hero"><div><div class="eyebrow">Fast help. Guarded by policy.</div><h1>${role==='support'?'发起协助，让 Agent 连续完成诊断':'打开工具，协助立即开始'}</h1><p>${role==='support'?'分享限时请求。设备上线后，安全策略自动处理命令。':'无需逐条点击允许；白名单自动执行，黑名单与未知命令直接阻断。'}</p></div><div class="hero-side">${pill(S?'策略已就绪':'等待创建请求',S?'green':'')}<p>未连接前，不会执行任何命令</p></div></div><div class="columns request-columns"><div class="stack"><section class="card pad"><div class="intro-person"><span class="avatar">支</span><div class="grow"><h3>本次技术支持</h3><small>由支持方发起 · 请求 ${esc(S?.id||'尚未创建')}</small></div>${pill('临时访问')}</div><div class="purpose">${esc(S?.purpose||customPurpose)}</div><div class="feedbackline">${ic('shield')}<span>策略仅放行诊断操作；停止连接后，后续请求将被拒绝。</span></div></section>${Scopes()}<div class="note">${ic('info')}<div>${IS_MAC?'下载本次请求的 Mac App，解压并打开；不安装系统服务。':'首次接入只需下载并打开一次，无安装向导。'}执行器会再次校验策略，所有判定写入协助记录。</div></div></div><aside class="stack sidebar">${RequestSide()}<section class="card pad"><h3>三个步骤，就可以开始</h3><div class="connectsteps"><div class="connectstep"><i>1</i>创建限时协助请求</div><div class="connectstep"><i>2</i>打开 assist 建立安全连接</div><div class="connectstep"><i>3</i>策略自动放行或阻断命令</div></div></section></aside></div>`;}
function Terminal(){let ops=S.operations||[];let sh=S.device?.shells?.[0]||selectedShell;return `<section class="terminal" aria-label="远程命令终端"><div class="termbar"><div class="row"><span class="dots"><i></i><i></i><i></i></span><strong>${nameShell(sh)}</strong><span class="termbadge">${PREVIEW?'SIMULATED':'POLICY GUARDED'}</span></div><div class="row"><small>${esc(S.device?.host||'等待设备')}</small>${active()&&['queued','running','cancelling'].includes(active().status)?`<button data-action="cancel-command" style="color:#e0a0ac">${ic('stop')} 停止命令</button>`:''}<button data-action="copy-output" title="复制执行记录">${ic('copy')}</button></div></div><div class="terminalbody" id="terminalOutput" tabindex="0" aria-label="命令与输出">${ops.length?ops.map(op=>`<article class="command-block"><div class="cmdmeta"><span>${esc(op.id)} · ${time(op.created)}</span><span>${esc(statusText[op.status]||op.status)} · ${esc(op.policy||'policy/verified')}</span></div><pre class="cmdprompt"><span class="prefix">${op.shell==='bash'?'$':'PS ›'}</span> ${esc(op.command)}</pre>${op.outputs.map(o=>`<pre class="raw-output ${['stderr','system'].includes(o.stream)?o.stream:''}">${esc(o.text)}</pre>`).join('')}${terminalStatus.includes(op.status)?`<div class="exitline ${op.status==='completed'?'ok':op.status==='failed'||op.status==='blocked'?'bad':''}"><span>${esc(statusText[op.status])}</span><span>${op.exit_code!==null&&op.exit_code!==undefined?'exit '+op.exit_code:'未执行 / 策略阻断'}</span>${op.duration_ms?`<span>${op.duration_ms} ms</span>`:''}</div>`:''}</article>`).join(''):`<div class="termempty">${ic('terminal')}<strong>连接已就绪，等待 Agent 发起诊断</strong><p>白名单自动执行；被阻断的命令也会在这里留痕。</p></div>`}</div><div class="termfoot"><span>${PREVIEW?'模拟输出 · 不会访问你的操作系统':'策略校验 · 非交互式 Shell · 当前用户权限'}</span><button style="border:0;background:none;color:inherit;font-size:inherit" data-action="follow">${follow?'✓ 跟随输出':'跟随已暂停'}</button></div></section>`;}
function SessionCard(){return `<section class="card pad side"><div class="cardhead"><h2>本次连接</h2>${pill(S.online?'在线':'离线',S.online?'green':'amber')}</div><div class="row"><div class="iconbox">${ic('monitor')}</div><div><h3>${esc(S.device.host||'未接入')}</h3><span class="tiny muted">${esc(S.device.os||'—')}</span></div></div><dl class="devicegrid"><dt>执行器</dt><dd>assist ${esc(S.device.version||VERSION)}</dd><dt>可用 Shell</dt><dd>${(S.device.shells||[]).map(nameShell).join(' / ')||'未报告'}</dd><dt>进程 PID</dt><dd class="mono">${esc(S.device.pid||'—')}</dd><dt>权限</dt><dd>当前用户 · 非只读沙箱</dd><dt>剩余时间</dt><dd data-clock class="mono">—</dd></dl><div class="sidebarbuttons">${btn('结束协助','end-dialog','danger full','stop')}</div><p class="min-note">本机关闭 assist 或按 Ctrl+C 也可停止。已完成的修改不会自动回滚。</p></section>`;}
function EventFeed(){const ev=(S.events||[]).filter(e=>e.type!=='output').slice(-5).reverse();return `<section class="card pad"><div class="cardhead"><h2>协助动态</h2><span class="tiny muted">双方同步</span></div><ul class="feed">${ev.length?ev.map(e=>`<li><time>${time(e.time)}</time><p>${esc(e.text)}</p></li>`).join(''):'<li><p>等待新的协助事件。</p></li>'}</ul></section>`;}
function LivePage(){return `<div class="hero"><div><div class="eyebrow">Continuous help. Policy guarded.</div><h1>协助持续进行，风险自动拦截</h1><p>诊断命令无需等待客户点击，策略判定与执行过程同步到双方页面。</p></div><div class="hero-side">${pill(active()?statusText[active().status]:'策略守护中',active()?'amber':'green')}<p>${esc(S.id)} · <span data-clock></span></p></div></div><div class="columns"><main class="stack"><div class="connection-health"><span class="row">${ic('network')}<strong>${S.online?'已连接客户设备':'设备连接中断'}</strong></span><span class="small muted">${PREVIEW?'交互预览 · 没有真实连接':S.online?'WebSocket 已验证 · 策略在两端生效':'禁止新操作 · 不自动重发命令'}</span></div>${PolicyCard()}${Terminal()}<div class="note">${ic('shield')}<span>白名单命令自动执行，黑名单与未知命令直接阻断。输出中仍可能包含敏感信息，请留意共享范围。</span></div></main><aside class="stack live-side">${SessionCard()}${EventFeed()}</aside></div>`;}
function CompletePage(){const ops=S.operations||[],ok=ops.filter(o=>o.status==='completed').length,failed=ops.filter(o=>['failed','timed_out','unknown'].includes(o.status)).length;return `<div class="hero"><div><div class="eyebrow">Access ends. The record stays.</div><h1>协助结束，控制权始终在你</h1><p>下面是本次操作与访问撤销的回执，不等同于问题已解决。</p></div><div class="hero-side">${pill(S.stopped?'停止已确认':'访问已撤销',S.stopped?'green':'amber')}</div></div><div class="columns"><div class="stack"><section class="card"><div class="finishhero"><div class="finishmark">${ic(S.stopped?'check':'clock')}</div><div><h1>本次协助已结束</h1><p>${S.stopped?'执行器已报告停止。不会继续接受本次请求的命令。':'已禁止后续操作，等待客户执行器确认停止。'}</p></div></div><div class="stats"><div><strong>${ops.length.toString().padStart(2,'0')}</strong><span>命令申请</span></div><div><strong>${ok.toString().padStart(2,'0')}</strong><span>执行完成</span></div><div><strong>${failed.toString().padStart(2,'0')}</strong><span>失败 / 超时 / 未知</span></div></div></section><section class="card pad"><div class="cardhead"><h2>执行记录</h2><span class="tiny muted">实际状态，不推断诊断结论</span></div>${ops.length?ops.map(o=>`<div class="receipt"><span style="color:${o.status==='completed'?'var(--green)':'var(--muted)'}">${ic(o.status==='completed'?'check':'info')}</span><div class="grow"><div class="row between"><h3>${esc(nameShell(o.shell))} · ${esc(o.id)}</h3>${pill(statusText[o.status]||o.status,o.status==='completed'?'green':'')}</div><pre class="codebox">${esc(o.command)}</pre><p>${o.exit_code!==null&&o.exit_code!==undefined?'退出码 '+o.exit_code+' · ':''}${o.duration_ms||0} ms</p></div></div>`).join(''):'<p class="small">本次没有执行命令。</p>'}<div class="row mt wrap">${btn('下载协助报告','report','','download')}${btn('查看完整终端记录','terminal-modal','','terminal')}<span class="tiny muted">不包含连接票据或管理密钥</span></div></section></div><aside class="stack"><section class="card pad"><div class="cardhead"><h2>访问与清理回执</h2>${ic('shield')}</div><div class="receipt">${ic('check')}<div><h3>后续访问已撤销</h3><p>旧邀请与设备凭据不能开启新操作。</p></div></div><div class="receipt ${S.stopped?'':'pending'}">${ic(S.stopped?'check':'clock')}<div><h3>${S.stopped?'执行器停止已确认':'执行器停止尚待确认'}</h3><p>${S.stopped?'收到本次执行器的停止回执。':'仅断开网络不能证明远端进程已停止；可在客户机关闭 assist。'}</p></div></div><div class="receipt">${ic('file')}<div><h3>工具保留，方便下次使用</h3><p>程序与 assist:// 关联不自动删除；不会开机启动。可运行卸载脚本移除。</p></div></div><div class="receipt">${ic('info')}<div><h3>既有修改不会自动回滚</h3><p>不保证清除命令自行创建的文件或独立后台服务。</p></div></div></section><div class="note">${ic('lock')}<span>再次协助需要新的请求与授权。旧链接不能重新激活访问。</span></div>${role==='support'?btn('新建一次协助','new-request','full','link'):''}</aside></div>`;}
function render(){const stage=pageState();const old=$('#terminalOutput');const pos=old?.scrollTop||0;const hadFocus=document.activeElement?.id==='consent';$('#app').innerHTML=Header()+`<div class="page"><div class="meta"><span class="row">${ic('link')}<span>协助请求</span><span>/</span><span class="mono">${esc(S?.id||'新建')}</span></span><span>${PREVIEW?'预览数据 · 不执行命令':'按需连接 · 不开放无人值守访问'}</span></div>${Stepper(stage)}${errorText?`<div class="errorline" role="alert">${esc(errorText)}</div>`:''}${stage==='request'?RequestPage():stage==='live'?LivePage():CompletePage()}${Footer()}</div>`;const term=$('#terminalOutput');if(term)term.scrollTop=follow?term.scrollHeight:pos;if(hadFocus)$('#consent')?.focus();if(stage!==lastPage){window.scrollTo({top:0,behavior:'instant'});lastPage=stage}updateClock();renderModal();updateDev();if(ENABLE_DEVTOOLS)Builder.sync();}
function updateClock(){if(!S)return;const ms=Math.max(0,new Date(S.expires)-Date.now());const v=String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0');document.querySelectorAll('[data-clock]').forEach(e=>e.textContent=v);}
setInterval(updateClock,1000);
function toast(text){clearTimeout(toastTimer);$('#toast-root').innerHTML=`<div class="toast">${esc(text)}</div>`;toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',4600)}
async function api(path,body,token=currentToken(),method=body===undefined?'GET':'POST'){const r=await fetch(path,{method,headers:{'Authorization':'Bearer '+token,...(body!==undefined?{'Content-Type':'application/json'}:{})},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});let out;try{out=await r.json()}catch(e){throw Error('服务没有返回预期数据，请确认运行的是 v0.2.0')}if(!r.ok)throw Error(out.error||'HTTP '+r.status);return out;}
async function refresh(){if(PREVIEW||!rid)return;applySnapshot(await api('/api/requests/'+rid));}
function applySnapshot(next){if(!next||next.id!==rid)return;if(S&&next.id===S.id&&Number(next.seq)<Number(S.seq))return;if(S&&next.id===S.id&&next.seq===S.seq&&next.status===S.status)return;S=next;errorText='';if(S.online&&modalKind==='connect')modalKind='';if(S.device?.shells?.length&&!S.device.shells.includes(selectedShell)){selectedShell=S.device.shells[0];commandDraft=selectedShell==='bash'?'date\npwd':'Get-Date\nGet-Location'}render()}
function startConnectionPoll(){if(PREVIEW||!rid||connectionPollTimer)return;connectionPollTimer=setInterval(async()=>{if(connectionPollBusy)return;if(S?.online||S?.revoked||['expired','revoked'].includes(S?.status)){clearInterval(connectionPollTimer);connectionPollTimer=null;return}connectionPollBusy=true;try{applySnapshot(await api('/api/requests/'+rid))}catch(e){}finally{connectionPollBusy=false}},450)}
async function stream(){if(PREVIEW||!rid)return;startConnectionPoll();streamAbort?.abort();const ctl=new AbortController();streamAbort=ctl;let failures=0;while(!ctl.signal.aborted){try{const res=await fetch('/api/requests/'+rid+'/events',{headers:{Authorization:'Bearer '+currentToken()},signal:ctl.signal});if(!res.ok)throw Error('事件流 HTTP '+res.status);const reader=res.body.getReader();const dec=new TextDecoder();let buf='';while(true){let {value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let j;while((j=buf.indexOf('\n\n'))>=0){const block=buf.slice(0,j);buf=buf.slice(j+2);const data=block.split('\n').filter(l=>l.startsWith('data: ')).map(l=>l.slice(6)).join('\n');if(data){applySnapshot(JSON.parse(data));failures=0;streamState='已同步';}}}}catch(e){if(ctl.signal.aborted)return;streamState='同步中断';failures++;if(failures>1){errorText='与协助服务的页面连接中断。不能据此判断远端已经停止；请在客户机关闭 assist。';render()}}await new Promise(r=>setTimeout(r,2000));}}

 if(modalKind==='connect'&&IS_MAC){title='在 Mac 上启动 assist';const pythonName=esc(S?.filename_python||'assist--当前请求标识.py');body=`<p>推荐先体验原生 Mac App。一个 ZIP 同时包含 Apple 芯片与 Intel 版本，不需要安装 Python、Node 或系统服务；每次新请求需下载对应的 App。</p><div class="row mt"><select class="platform grow" id="platform" aria-label="Mac 接入方式"><option value="mac-app">Mac App · 推荐体验</option><option value="python">Python 3 脚本 · 备选</option></select>${btn('下载所选版本','download-tool','primary','download')}</div><div data-mac-app><p class="label">下载后</p><div class="connectsteps"><div class="connectstep"><i>1</i>双击 ZIP 解压（浏览器也可能自动解压）</div><div class="connectstep"><i>2</i>打开 Assist.app；终端会显示连接与执行状态</div><div class="connectstep"><i>3</i>保持终端窗口打开；结束协助可在网页操作或按 Ctrl+C</div></div><p class="min-note">此体验版未签名、公证，也未在真实 Mac 上验收。若 macOS 拒绝打开，请只在确认来源可信时通过系统设置 → 隐私与安全性 → 仍要打开；不要关闭 Gatekeeper。</p></div><div data-mac-python hidden><p class="label">已有 Python 3.8+ 时，可使用脚本</p><pre class="codebox">cd ~/Downloads\npython3 './${pythonName}'</pre><p class="min-note">Python 脚本仅使用标准库；请保留下载文件名并保持终端窗口打开。</p></div><div class="note amber mt">${ic('info')}<span>Mac App 和 Python 脚本都只连接本次限时请求。原生 App 无安装服务、无开机启动；下载文件及解压后的 App 需由你自行删除。</span></div>`;}

  function scan(){
    const stage=pageState(),key=stage+'-'+role;
    state.roots=buildModel();state.flat=[];state.map.clear();
    document.querySelectorAll('[data-ui-module]').forEach(el=>{el.removeAttribute('data-ui-module');el.removeAttribute('data-ui-name');});
    const walk=(nodes,parent=null,depth=0)=>nodes.forEach(node=>{
      node.parent=parent;node.depth=depth;
      node.path=[...(parent?.path||[]),node.name];
      try{node.targets=[...document.querySelectorAll(node.selector)].filter(el=>el.getClientRects().length>0&&getComputedStyle(el).visibility!=='hidden');}catch(_){node.targets=[];}
      node.present=node.targets.length>0;
      node.targets.forEach(el=>{el.dataset.uiModule=node.id;el.dataset.uiName=node.name});
      state.flat.push(node);state.map.set(node.id,node);walk(node.children,node,depth+1);
    });walk(state.roots);
    if(!state.initializedPages.has(key)){
      state.flat.filter(node=>node.children.length&&(['page','region'].includes(node.level)||node.id==='G')).forEach(node=>state.expanded.add(node.id));
      state.initializedPages.add(key);
    }
    if(state.page!==key){state.page=key;state.hover=null;state.selected=null;state.query='';state.focus='P';state.treeScroll=0;}
    if(state.selected&&!state.map.has(state.selected))state.selected=null;
    if(state.hover&&!state.map.has(state.hover))state.hover=null;
  }

  function matches(node){const q=state.query.trim().toLowerCase();return !q||[node.id,node.name,node.component,node.description,...(node.flow||[]).flat()].join(' ').toLowerCase().includes(q);}

  function treeHTML(){

    else return;
    e.preventDefault();e.stopPropagation();
    if(focus){state.focus=focus.dataset.bnode;items.forEach(el=>el.tabIndex=el===focus?0:-1);focus.focus({preventScroll:true});focus.querySelector('.b-tree-row')?.scrollIntoView({block:'nearest'});state.hover=state.focus;refreshFlags();requestDraw();}
  }
  function setup(){
    if(state.init||!ENABLE_DEVTOOLS)return;state.init=true;
    if(innerWidth<600){state.w=innerWidth-16;state.h=Math.round(innerHeight*.65);}
    try{const saved=JSON.parse(localStorage.getItem('assist-builder-layout-v1')||'null');if(saved&&['x','y','w','h'].every(k=>typeof saved[k]==='number'&&Number.isFinite(saved[k])))Object.assign(state,saved);}catch(_){}
    document.addEventListener('click',e=>{
      if(!devOpen)return;
      const target=e.target.closest('[data-ui-module]');
      if(state.picking&&target&&!e.target.closest('#dev-root')){e.preventDefault();e.stopImmediatePropagation();state.picking=false;state.query='';devTab='structure';render();select(target.dataset.uiModule,{scroll:false});refreshFlags();return;}
      const toggle=e.target.closest('[data-btoggle]');if(toggle){e.preventDefault();e.stopImmediatePropagation();const id=toggle.dataset.btoggle;state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);state.focus=id;refreshTree(true);return;}
      const row=e.target.closest('[data-brow]');if(row){e.preventDefault();select(row.dataset.brow);refreshTree(true);return;}
      const action=e.target.closest('[data-b]');if(action&&!action.disabled){e.preventDefault();act(action.dataset.b).catch(err=>toast(err.message));return;}
      const jumpButton=e.target.closest('[data-bjump]');if(jumpButton){e.preventDefault();jump(jumpButton.dataset.bjump);return;}
      const tab=e.target.closest('[data-btab]');if(tab){e.preventDefault();state.hover=null;devTab=tab.dataset.btab;render();return;}
    },true);
    document.addEventListener('pointerover',e=>{
      if(!devOpen)return;
      const row=e.target.closest('[data-brow]');
      if(row){if(state.hover!==row.dataset.brow){state.hover=row.dataset.brow;refreshFlags();requestDraw();}return;}
      if(state.picking&&!e.target.closest('#dev-root')){const el=e.target.closest('[data-ui-module]');if(el&&state.hover!==el.dataset.uiModule){state.hover=el.dataset.uiModule;refreshFlags();requestDraw();}}
    });
    document.addEventListener('pointerout',e=>{
      const row=e.target.closest('[data-brow]');if(row&&!row.contains(e.relatedTarget)){state.hover=null;refreshFlags();requestDraw();}
    });
    document.addEventListener('focusin',e=>{if(!devOpen)return;const item=e.target.closest('[data-bnode]');if(item){state.focus=item.dataset.bnode;state.hover=state.focus;refreshFlags();requestDraw();}});
    document.addEventListener('input',e=>{if(e.target.id==='builderSearch'){state.query=e.target.value;refreshTree();}});
    document.addEventListener('keydown',keyboard,true);
    document.addEventListener('pointerdown',e=>{
      const handle=e.target.closest('[data-bdrag],[data-bresize]');if(!handle||e.button!==0||e.target.closest('button'))return;
      const panel=$('#builderPanel');if(!panel)return;
      state.drag={pointer:e.pointerId,startX:e.clientX,startY:e.clientY,x:state.x,y:state.y,w:state.w,h:state.h,resize:handle.hasAttribute('data-bresize')};
      panel.dataset.dragging='';handle.setPointerCapture(e.pointerId);e.preventDefault();
    });
    document.addEventListener('pointermove',e=>{const d=state.drag;if(!d||d.pointer!==e.pointerId)return;const dx=e.clientX-d.startX,dy=e.clientY-d.startY;if(d.resize){state.w=d.w+dx;state.h=d.h+dy;}else{state.x=d.x+dx;state.y=d.y+dy;}applyPosition();requestDraw();});
    const release=()=>{if(!state.drag)return;state.drag=null;$('#builderPanel')?.removeAttribute('data-dragging');savePosition();};
    document.addEventListener('pointerup',release);document.addEventListener('pointercancel',release);
    document.addEventListener('scroll',e=>{if(e.target?.id==='builderTreeScroll')state.treeScroll=e.target.scrollTop;if(devOpen)requestDraw();},true);
    window.addEventListener('resize',()=>{if(devOpen){applyPosition();requestDraw();}});
  }
  return {render,sync,jump,select,bindBusinessRender,debug:()=>({selected:state.selected,hover:state.hover,picking:state.picking,modules:state.flat.map(n=>({id:n.id,name:n.name,selector:n.selector,present:n.present,count:n.targets.length,level:n.level})),position:{x:state.x,y:state.y,w:state.w,h:state.h}})};
})();
Builder.bindBusinessRender(render);

init();
</script>
</body>
</html>
